# Render Blueprint — NextGen Roofing & Construction
# Live at https://nextgenroofing.work (custom domain on this service; served from the root).
services:
  - type: web
    name: nextgen-roofing-preview
    runtime: node
    plan: free            # free tier sleeps when idle (slow first load); "starter" stays awake — owner's choice
    branch: claude/nextgen-roofing-website-k8ccjl
    # build:render = webpack, 1 worker, capped heap (~440 MB peak measured) to fit 512 MB instances
    buildCommand: npm ci && npm run build:render
    # Runs Next directly (no npm/wrapper processes resident). MALLOC_ARENA_MAX=2 limits glibc
    # allocator fragmentation from native image processing (measured: lower, stable RSS).
    startCommand: MALLOC_ARENA_MAX=2 node scripts/with-env.cjs .env.live start -p $PORT -H 0.0.0.0
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: LEAD_SINKS
        value: google-sheet
      # Secrets: set in the Render dashboard (never committed)
      - key: LEAD_SHEET_WEBHOOK_URL
        sync: false
      - key: LEAD_SHEET_TOKEN
        sync: false
